[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patchreach"
version = "0.1.0"
description = "Diff-scoped reach certificate: does a benchmark execute the lines a patch changed?"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "linluozi"}]
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
patchreach = "patchreach.cli:main"

[tool.setuptools.packages.find]
include = ["patchreach*"]
